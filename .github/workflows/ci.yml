name: kiosk checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIOSK_NFC: disabled
      KIOSK_PRINT: screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Korean print font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install software test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Frontend behavior and state tests
        run: npm test
      - name: Backend contracts and device failure tests
        run: python -m pytest tests integrations/mirrorting/test_bridge_client.py -q
      - name: Python syntax
        run: python -m compileall -q backend scripts/run_kiosk.py scripts/preflight.py scripts/kiosk_admin.py integrations/mirrorting/bridge_client.py
      - name: Whitespace check
        run: git diff --check
